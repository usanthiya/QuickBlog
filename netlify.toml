[build]
  command = "npm run build:client"
  publish = "client/dist"
  site_id = "quickblog-placeholder"

[functions]
  directory = "server/functions"
  node_bundler = "esbuild"
  included_files = ["server/**/*.js"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
